<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile - Dark Vibe</title>
    
    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#09090b',
                        cardBg: '#121214',
                        cardBorder: '#27272a',
                        accentDark: '#4c1d95',
                        accentGlow: '#8b5cf6',
                        accentBlue: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: theme('colors.darkBg');
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        /* Subtle ambient glow behind the card */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(59, 130, 246, 0.15) 100%);
            filter: blur(80px);
            z-index: -1;
            border-radius: 50%;
        }

        /* Avatar glow animation */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px -3px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 25px -1px rgba(139, 92, 246, 0.6); }
        }
        
        .avatar-container {
            animation: pulse-glow 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-accentGlow selection:text-white">

    <!-- Main Container -->
    <div class="relative w-full max-w-md">
        <!-- Background Glow Effect -->
        <div class="ambient-glow"></div>

        <!-- Profile Card -->
        <div class="bg-cardBg border border-cardBorder rounded-3xl overflow-hidden shadow-2xl relative z-10 backdrop-blur-sm">
            
            <!-- Cover Header (Gradient) -->
            <div class="h-32 w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-blue-600 opacity-80 relative overflow-hidden">
                <!-- Abstract diagonal lines for texture -->
                <div class="absolute inset-0 opacity-20" 
                     style="background-image: linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000), linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000); 
                            background-size: 20px 20px; 
                            background-position: 0 0, 10px 10px;">
                </div>
            </div>

            <!-- Card Content Content -->
            <div class="px-8 pb-8 relative">
                
                <!-- Avatar -->
                <div class="flex justify-center -mt-16 mb-4 relative z-20">
                    <div class="avatar-container rounded-full p-1 bg-cardBg border border-cardBorder shadow-xl">
                        <img src="https://placehold.co/120x120/1a1a1a/8b5cf6?text=Profile" 
                             alt="Profile Picture" 
                             class="w-28 h-28 object-cover rounded-full border border-gray-800">
                    </div>
                </div>

                <!-- Name & Title -->
                <div class="text-center mb-6">
                    <h1 class="text-2xl font-bold text-white tracking-tight mb-1">Alex Developer</h1>
                    <p class="text-accentGlow text-sm font-medium tracking-wide uppercase flex items-center justify-center gap-2">
                        <i class="ph ph-terminal-window text-lg"></i>
                        Full Stack Engineer
                    </p>
                </div>

                <!-- Bio -->
                <div class="mb-8 text-center">
                    <p class="text-gray-400 text-sm leading-relaxed">
                        Crafting digital experiences with modern web technologies. Passionate about clean code, performance, and dark mode interfaces. Building the web, one line at a time.
                    </p>
                </div>

                <!-- Skills Section -->
                <div class="mb-8">
                    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 text-center">Core Skills</h3>
                    <div class="flex flex-wrap justify-center gap-2">
                        <span class="px-3 py-1 bg-gray-800/60 border border-gray-700/50 rounded-full text-xs font-medium text-gray-300 hover:border-accentGlow/50 hover:text-white transition-colors cursor-default backdrop-blur-md">React & Next.js</span>
                        <span class="px-3 py-1 bg-gray-800/60 border border-gray-700/50 rounded-full text-xs font-medium text-gray-300 hover:border-accentGlow/50 hover:text-white transition-colors cursor-default backdrop-blur-md">TypeScript</span>
                        <span class="px-3 py-1 bg-gray-800/60 border border-gray-700/50 rounded-full text-xs font-medium text-gray-300 hover:border-accentBlue/50 hover:text-white transition-colors cursor-default backdrop-blur-md">Tailwind CSS</span>
                        <span class="px-3 py-1 bg-gray-800/60 border border-gray-700/50 rounded-full text-xs font-medium text-gray-300 hover:border-accentGlow/50 hover:text-white transition-colors cursor-default backdrop-blur-md">Node.js</span>
                        <span class="px-3 py-1 bg-gray-800/60 border border-gray-700/50 rounded-full text-xs font-medium text-gray-300 hover:border-accentBlue/50 hover:text-white transition-colors cursor-default backdrop-blur-md">Python</span>
                    </div>
                </div>

                <!-- Social Links -->
                <div class="pt-6 border-t border-cardBorder/60 flex justify-center gap-6">
                    <a href="#" class="text-gray-400 hover:text-white hover:scale-110 transition-all duration-300" title="GitHub">
                        <i class="ph ph-github-logo text-2xl"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-accentBlue hover:scale-110 transition-all duration-300" title="Twitter">
                        <i class="ph ph-twitter-logo text-2xl"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-blue-500 hover:scale-110 transition-all duration-300" title="LinkedIn">
                        <i class="ph ph-linkedin-logo text-2xl"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-pink-500 hover:scale-110 transition-all duration-300" title="Dribbble">
                        <i class="ph ph-dribbble-logo text-2xl"></i>
                    </a>
                </div>

                <!-- CTA Button (Optional) -->
                <div class="mt-8">
                    <button class="w-full py-3 px-4 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-sm font-medium text-white transition-all duration-300 group flex justify-center items-center gap-2">
                        <span>Get in Touch</span>
                        <i class="ph ph-paper-plane-right group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform duration-300 text-accentGlow"></i>
                    </button>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
